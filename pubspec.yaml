name: footarena
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
#  go_router: ^14.0.0
  bloc: ^9.2.0
  bot_toast: ^4.1.3
  collection: ^1.19.1
  dartz: ^0.10.1
  device_preview: ^1.3.1
  dio: ^5.9.2
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  extended_image: ^10.0.1

  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.4
  get_it: ^9.2.1
  google_fonts: ^8.1.0
  injectable: ^3.0.0
  logger: ^2.7.0
  pin_code_fields: ^9.3.0
  responsive_framework: ^1.5.1
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  dropdown_button2: ^3.1.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  flutter_gen_runner: ^5.14.1

flutter_gen:
  output: lib/common/design/src/theme/
  line_length: 80

  integrations:
    flutter_svg: true

  assets:
    enabled: true

  fonts:
    enabled: true


flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/jpg/
    - assets/translations/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
